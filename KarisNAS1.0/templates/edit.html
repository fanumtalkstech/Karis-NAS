<!DOCTYPE html>
<html lang="en" data-theme="{{ user_theme or 'dark' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ filename }} | Karis-NAS</title>
    <link rel="manifest" href="{{ url_for('manifest') }}">
    <link rel="icon" href="{{ url_for('app_icon') }}">
    <style>
        :root {
            --bg: #0A0A0C; --card: #1C1C1E; --card-2: #2C2C2E;
            --text-primary: #F5F5F7; --text-secondary: #98989F;
            --accent: #0A84FF; --border: #38383A; --danger: #FF453A; --ok: #30D158;
        }
        [data-theme="light"] {
            --bg: #F2F2F7; --card: #FFFFFF; --card-2: #E5E5EA;
            --text-primary: #1C1C1E; --text-secondary: #6C6C70;
            --accent: #007AFF; --border: #D1D1D6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; background: var(--bg); color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        header {
            display: flex; align-items: center; gap: 16px; padding: 16px 24px;
            background: var(--card); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 10;
        }
        .title { font-size: 15px; font-weight: 700; word-break: break-all; }
        .sub { font-size: 12px; color: var(--text-secondary); }
        .spacer { flex: 1; }
        .btn {
            border: none; border-radius: 999px; padding: 9px 18px; font-size: 13.5px;
            font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
            font-family: inherit;
        }
        .btn.primary { background: var(--accent); color: #fff; }
        .btn.secondary { background: var(--card-2); color: var(--text-primary); }
        .btn:disabled { opacity: .55; cursor: default; }
        textarea {
            flex: 1; width: 100%; margin: 0; padding: 20px 24px;
            background: var(--bg); color: var(--text-primary); border: none; outline: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13.5px; line-height: 1.6; resize: none; tab-size: 4;
            white-space: pre; overflow: auto;
        }
        .status { font-size: 12.5px; color: var(--text-secondary); }
        .status.dirty { color: #FF9500; }
        .status.saved { color: var(--ok); }
    </style>
</head>
<body>
    <form id="editForm" method="POST" style="display:flex; flex-direction:column; flex:1; min-height:0;">
        <header>
            <a class="btn secondary" href="{{ url_for('dashboard') }}">← Back</a>
            <div>
                <div class="title">{{ filename }}</div>
                <div class="sub">Text editor &bull; saved in place on disk</div>
            </div>
            <div class="spacer"></div>
            <span id="status" class="status">Ready</span>
            <button type="submit" class="btn primary" id="saveBtn">Save</button>
        </header>
        <textarea id="content" name="content" spellcheck="false" autocomplete="off"
                  placeholder="This file is empty.">{{ content }}</textarea>
    </form>

    <script>
        const ta = document.getElementById('content');
        const statusEl = document.getElementById('status');
        let dirty = false;

        function markDirty() {
            if (dirty) return;
            dirty = true;
            statusEl.textContent = 'Unsaved changes';
            statusEl.className = 'status dirty';
        }

        ta.addEventListener('input', markDirty);

        // Tab inserts four spaces instead of leaving the field
        ta.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = ta.selectionStart, end = ta.selectionEnd;
                ta.value = ta.value.slice(0, start) + '    ' + ta.value.slice(end);
                ta.selectionStart = ta.selectionEnd = start + 4;
                markDirty();
            }
            if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                e.preventDefault();
                document.getElementById('editForm').submit();
            }
        });

        document.getElementById('editForm').addEventListener('submit', () => {
            document.getElementById('saveBtn').disabled = true;
            statusEl.textContent = 'Saving...';
            statusEl.className = 'status';
        });

        window.addEventListener('beforeunload', (e) => {
            if (dirty) { e.preventDefault(); e.returnValue = ''; }
        });
    </script>
</body>
</html>
